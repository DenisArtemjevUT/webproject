<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostIt - Add post</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="frame">
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="addPost.html">Add Post</a>
        </nav>
        <div class="profile">
            <button type="button" id="profBtn"><img src="images/avatarw.png" alt="Profile"></button>
            <div class="info-box" id="infBox" hidden>
                <p>Denis</p>
                <p>justfortest@mgail.com</p>
                <a href="login.html">Logout</a>
            </div>
        </div>
    </header>
    <main>
        <form action="index.html" method="get">
            <h1>Create a post</h1>

            <label for="postBody">Post body</label>
            <textarea id="postBody" name="postBody" rows="5" placeholder="What's new?" required></textarea>

            <label for="postImage">Select file</label>
            <input type="file" id="postImage" name="postImage" accept="image/*">

            <button type="submit">Create post</button>
        </form>
    </main>
</body>

</html>
